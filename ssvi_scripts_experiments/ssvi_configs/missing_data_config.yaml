# SSVI GP-LVM Configuration with Missing Data Reconstruction
# This configuration enables missing data reconstruction capabilities

# === Basic Model Configuration ===
latent_dim: 6                    # Latent space dimensionality
n_inducing_points: 8             # Number of inducing points (faster for demo)
encoder_hidden_dims: [128, 64]   # Encoder architecture

# === Training Configuration ===
training_iterations: 200         # Number of training iterations  
batch_size: 50                   # Mini-batch size
local_lr: 0.002                  # Learning rate for encoder parameters
global_lr: 0.01                  # Learning rate for GP hyperparameters

# === Missing Data Configuration ===
enable_missing_data: true        # Enable missing data reconstruction
missing_data_ratio: 0.3          # Fraction of dimensions to mask (30%)
reconstruction_samples: 50       # Number of samples for reconstruction

# === GP Hyperparameters ===
init_lengthscales: 1.0           # Initial lengthscales value (1/beta) - default matches current standard
init_output_noise_scale: 1.0     # Initial output noise scale (sigma2) - default matches current standard
P: 4                             # Number of structured samples
trainable_V: true                # Learn inducing point locations

# === Evaluation Configuration ===
enable_metrics: true             # Compute evaluation metrics
metrics_frequency: 50            # Compute metrics every N iterations
test_size: 0.1                   # Fraction for test set

# === Visualization Configuration ===
save_training_plots: true        # Save training plots
plot_save_frequency: 50          # Save plots every N iterations
plot_training: true              # Plot training curves
plot_latent_space: true          # Plot latent space visualization
plot_hyperparams: true           # Plot hyperparameter evolution

# === Logging Configuration ===
log_frequency: 25                # Log every N iterations
enable_gradient_logging: true    # Log gradient information
gradient_log_frequency: 25       # Log gradients every N iterations
save_results: true               # Save results to disk
results_dir: "oil_flow_results/ssvi_results"  # Fixed: relative to current working directory
