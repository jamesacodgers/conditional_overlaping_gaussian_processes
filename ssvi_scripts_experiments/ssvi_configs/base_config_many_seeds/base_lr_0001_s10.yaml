# Base SSVI Configuration for Oil Flow GP-LVM
# Based on second_best_config from original script

# Device Configuration
device: "cuda"  # "auto", "cuda", "cpu", or specific device like "cuda:0"

# Data Configuration
data_url: "http://staffwww.dcs.shef.ac.uk/people/N.Lawrence/resources/3PhData.tar.gz"
latent_dim: 10

# Model Architecture
n_inducing_points: 64
encoder_hidden_dims: [128, 64, 32]

# Training Configuration
training_iterations: 60000
batch_size: 128

# Learning Rates
local_lr: 0.001   # Encoder parameters
global_lr: 0.001  # GP hyperparameters

# GP Hyperparameters
sigma2: 1.0
beta: [1.0]  # Initial beta values (will be converted to tensor)
sigma2_s: null  # Signal variances (null = auto)
P: 64  # Number of samples for SSVI
trainable_V: true

# Visualization
plot_training: true
plot_latent_space: true
plot_hyperparams: true

# Checkpoint Configuration
checkpoint_frequency: 100  # Save models, plots, metrics, and log progress every N iterations

# Advanced Logging
enable_gradient_logging: true
gradient_log_frequency: 50  # Log gradients every N iterations
save_results: true  # Save results to folder

# Metrics Configuration
enable_metrics: true
test_size_int: 100  # Number of test samples (like original GP LVM) - 900 train, 100 test
random_seed: 10  # Random seed for reproducibility (matches original GP-LVM base config)

# Visualization Configuration
save_training_plots: true
