# Base configuration for Original GP LVM matching oilflow_expt.py settings
# Based on generalised_gplvm_code/experiments/oilflow_expt.py

# Device Configuration
device: "cuda"

# Data Configuration  
dataset: "oilflow"
test_size: 0.1  # Fraction of data for testing
random_seed: 7  # Matches oilflow_expt.py: SEED = 7

# Model Configuration (matching SSVI base config)
latent_dim: 10  # Matches SSVI base config: latent_dim: 10
n_inducing: 32  # Matches SSVI base config: n_inducing_points: 64
pca_init: true   # Initialize latent variables with PCA

# Models to run (from oilflow_expt.py models list)
models: ["gauss", "nn_gauss"]

# Training Configuration (from oilflow_expt.py)
training_steps:
  gauss: 60000      # Matches oilflow_expt.py: steps = [60000, 60000, 60000, 60000]
  nn_gauss: 60000   # Matches oilflow_expt.py: steps = [60000, 60000, 60000, 60000]
batch_size: 128     # Matches SSVI base config: batch_size: 128
learning_rate: 0.001  # Matches oilflow_expt.py: lr=0.001

# Model-specific Configuration (from oilflow_expt.py)
# For nn_gauss model: nn_layers matching SSVI base config
nn_layers: [128, 64, 32]

# Prior Configuration (from oilflow_expt.py)
# For gauss model: NormalPrior(X_prior_mean, torch.ones_like(X_prior_mean))
# For nn_gauss model: MultivariateNormalPrior(X_prior_mean, torch.eye(X_prior_mean.shape[1]))
prior_type:
  gauss: "normal"           # NormalPrior for gauss model
  nn_gauss: "multivariate"  # MultivariateNormalPrior for nn_gauss model

# Results Configuration
save_results: true
results_dir: "oil_flow_results/original_gplvm_results"  # Fixed: relative to current working directory
experiment_name: "base"

# Checkpoint Configuration
checkpoint_frequency: 4000  # Save models, plots, metrics, and log progress every N iterations

# Visualization Configuration (from oilflow_expt.py)
save_plots: true
plot_colors: ["r", "b", "g"]  # Matches oilflow_expt.py: colors=['r', 'b', 'g']

# Testing Configuration
enable_testing: true
test_iterations: 5000

# Additional Configuration from oilflow_expt.py
# Kernel configuration: ScaleKernel(RBFKernel(ard_num_dims=latent_dim))
kernel_type: "rbf"
use_ard: true  # ARD (Automatic Relevance Determination) for RBF kernel

# Mean function: ZeroMean() in oilflow_expt.py
mean_function: "zero"

# Variational configuration
variational_strategy: "cholesky"  # CholeskyVariationalDistribution in oilflow_expt.py
learn_inducing_locations: true    # learn_inducing_locations=True in oilflow_expt.py

# === GP Hyperparameters ===
init_lengthscales: 1.0  # Initial lengthscales value (default matches GPyTorch RBFKernel)
init_output_noise_scale: 1.0  # Initial output noise scale (default matches GPyTorch GaussianLikelihood)