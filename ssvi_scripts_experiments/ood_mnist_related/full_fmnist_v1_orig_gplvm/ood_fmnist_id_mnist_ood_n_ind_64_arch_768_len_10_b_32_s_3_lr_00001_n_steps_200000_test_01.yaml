# Generated by full_mnist_generate_config_grid.py from fashion_mnist_ood_experiment_final_v2_orig_gplvm/ood_fmnist_id_mnist_ood_n_ind_64_arch_768_len_10_b_32_s_0_lr_00001_n_steps_200000_test_01.yaml
# Base configuration for Original GP LVM OOD Detection
# MNIST vs FashionMNIST Out-of-Distribution Detection

# Device Configuration
device: "cuda"

# Data Configuration  
dataset: "oilflow"
test_size: 0.1  # Fraction of data for testing
random_seed: 3

# Model Configuration (matching SSVI base config)
latent_dim: 10
n_inducing: 64
pca_init: true   # Initialize latent variables with PCA

# Models to run (from oilflow_expt.py models list)
models: ["gauss", "nn_gauss"]

# Training Configuration (from oilflow_expt.py)
training_steps:
  gauss: 200000
  nn_gauss: 200000
batch_size: 32
learning_rate: 0.0001

# Model-specific Configuration (from oilflow_expt.py)
# For nn_gauss model: nn_layers matching SSVI base config
nn_layers: [512, 256]

# Prior Configuration (from oilflow_expt.py)
prior_type:
  gauss: "normal"           # NormalPrior for gauss model
  nn_gauss: "multivariate"  # MultivariateNormalPrior for nn_gauss model

# Results Configuration
save_results: true
results_dir: "ood_results/original_gplvm_results"  # OOD results directory
experiment_name: "base"

# Checkpoint Configuration
checkpoint_frequency: 20000

# Visualization Configuration
save_plots: true
plot_colors: ["r", "b", "g"]

# Testing Configuration
enable_testing: true
test_iterations: 5000

# Kernel configuration
kernel_type: "rbf"
use_ard: true  # ARD (Automatic Relevance Determination) for RBF kernel

# Mean function
mean_function: "zero"

# Variational configuration
variational_strategy: "cholesky"
learn_inducing_locations: true

# === GP Hyperparameters ===
init_lengthscales: 1.0
init_output_noise_scale: 1.0

# === OOD Detection Configuration ===
# In-Distribution (ID) Dataset Configuration
id_dataset: "FashionMNIST"      # ID dataset name: "MNIST" or "FashionMNIST"
id_classes: null                # ID class indices (null = all classes)
                                # FashionMNIST classes: 0=T-shirt, 1=Trouser, 2=Pullover, 3=Dress, 4=Coat,
                                #                       5=Sandal, 6=Shirt, 7=Sneaker, 8=Bag, 9=Ankle boot
id_samples_per_class: null

# Out-of-Distribution (OOD) Dataset Configuration
ood_dataset: "MNIST"             # OOD dataset name (must be explicitly specified)
ood_classes: null               # OOD class indices (null = all classes)
                                # MNIST classes: 0-9 = Digits 0-9
ood_samples_per_class: 500     # Samples per OOD class (null = use all)

# OOD Score Types
ood_score_types:                # Score types to compute for OOD detection
  - nlpd
  - rmse
  - variance

# OOD Evaluation Configuration
ood_n_samples: 4               # Number of samples for OOD evaluation (null = default 4)

# Missing Data Configuration
enable_missing_data: false       # Enable missing data reconstruction capability
missing_data_ratio: 0.3         # Fraction of dimensions to artificially mask (for testing)
reconstruction_samples: 50      # Number of samples for missing data reconstruction
use_official_split: true
metrics_frequency: 20000
