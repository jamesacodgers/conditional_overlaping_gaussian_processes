# Generated by full_mnist_generate_config_grid.py from reverse_mnist_ood_experiment_final_v3_ssvi/ood_mnist_id_fmnist_ood_n_ind_64_arch_768_len_10_b_32_s_0_lr_00001_n_steps_200000_P_4_test_01.yaml
# Base SSVI Configuration for OOD Detection GP-LVM
# MNIST vs FashionMNIST Out-of-Distribution Detection

# Device Configuration
device: "cuda"  # "auto", "cuda", "cpu", or specific device like "cuda:0"

# Data Configuration
data_url: "http://staffwww.dcs.shef.ac.uk/people/N.Lawrence/resources/3PhData.tar.gz"
latent_dim: 10

# Model Architecture
n_inducing_points: 64
encoder_hidden_dims: [512, 256]

# Training Configuration
training_iterations: 200000
batch_size: 32

# Learning Rates
local_lr: 0.0001   # Encoder parameters
global_lr: 0.0001  # GP hyperparameters

# GP Hyperparameters
sigma2_s: null  # Signal variances (null = auto)
init_lengthscales: 1.0  # Initial lengthscales value (1/beta) - default matches current standard
init_output_noise_scale: 1.0  # Initial output noise scale (sigma2) - default matches current standard
P: 4  # Number of samples for SSVI
trainable_V: true

# Visualization
plot_training: true
plot_latent_space: true
plot_hyperparams: true

# Checkpoint Configuration
checkpoint_frequency: 20000

# Advanced Logging
enable_gradient_logging: true
gradient_log_frequency: 4000  # Log gradients every N iterations
save_results: true  # Save results to folder
results_dir: "ood_results/ssvi_results"  # OOD results directory

# Metrics Configuration
enable_metrics: true
test_size: 0.1  # Fraction of data for testing
random_seed: 3

# Visualization Configuration
save_training_plots: true

# === OOD Detection Configuration ===
# In-Distribution (ID) Dataset Configuration
id_dataset: "MNIST"      # ID dataset name: "MNIST" or "FashionMNIST"
id_classes: null                # ID class indices (null = all classes)
                                # FashionMNIST classes: 0=T-shirt, 1=Trouser, 2=Pullover, 3=Dress, 4=Coat,
                                #                       5=Sandal, 6=Shirt, 7=Sneaker, 8=Bag, 9=Ankle boot
id_samples_per_class: null

# Out-of-Distribution (OOD) Dataset Configuration
ood_dataset: "FashionMNIST"             # OOD dataset name (must be explicitly specified)
ood_classes: null               # OOD class indices (null = all classes)
                                # MNIST classes: 0-9 = Digits 0-9
ood_samples_per_class: 500     # Samples per OOD class (null = use all)

# OOD Score Types
ood_score_types:                # Score types to compute for OOD detection
  - nlpd
  - rmse
  - variance

# OOD Evaluation Configuration
ood_n_samples: 4               # Number of samples for OOD evaluation (null = use training P)

# Missing Data Configuration
enable_missing_data: false       # Enable missing data reconstruction capability
missing_data_ratio: 0.3         # Fraction of dimensions to artificially mask (for testing)
reconstruction_samples: 50      # Number of samples for missing data reconstruction
use_official_split: true
metrics_frequency: 20000
