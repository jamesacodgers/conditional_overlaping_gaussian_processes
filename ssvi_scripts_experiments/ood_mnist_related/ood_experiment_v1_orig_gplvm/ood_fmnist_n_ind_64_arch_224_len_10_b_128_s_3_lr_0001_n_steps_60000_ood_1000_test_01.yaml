# Base configuration for Original GP LVM OOD Detection
# MNIST vs FashionMNIST Out-of-Distribution Detection

# Device Configuration
device: "cuda"

# Data Configuration  
dataset: "oilflow"
test_size: 0.1  # Fraction of data for testing
random_seed: 3  # Matches oilflow_expt.py: SEED = 7

# Model Configuration (matching SSVI base config)
latent_dim: 10
n_inducing: 64
pca_init: true   # Initialize latent variables with PCA

# Models to run (from oilflow_expt.py models list)
models: ["gauss", "nn_gauss"]

# Training Configuration (from oilflow_expt.py)
training_steps:
  gauss: 60000
  nn_gauss: 60000
batch_size: 128
learning_rate: 0.001

# Model-specific Configuration (from oilflow_expt.py)
# For nn_gauss model: nn_layers matching SSVI base config
nn_layers: [128, 64, 32]

# Prior Configuration (from oilflow_expt.py)
prior_type:
  gauss: "normal"           # NormalPrior for gauss model
  nn_gauss: "multivariate"  # MultivariateNormalPrior for nn_gauss model

# Results Configuration
save_results: true
results_dir: "ood_results/original_gplvm_results"  # OOD results directory
experiment_name: "base"

# Checkpoint Configuration
checkpoint_frequency: 4000  # Save models, plots, metrics, and log progress every N iterations

# Visualization Configuration
save_plots: true
plot_colors: ["r", "b", "g"]

# Testing Configuration
enable_testing: true
test_iterations: 5000

# Kernel configuration
kernel_type: "rbf"
use_ard: true  # ARD (Automatic Relevance Determination) for RBF kernel

# Mean function
mean_function: "zero"

# Variational configuration
variational_strategy: "cholesky"
learn_inducing_locations: true

# === GP Hyperparameters ===
init_lengthscales: 1.0
init_output_noise_scale: 1.0

# === MNIST Data Filtering Configuration ===
# Used when id_dataset="MNIST" for ID, or for OOD when ID is FashionMNIST
# Labels 0-9 = Digits 0-9
# null = all 10 digits, with samples_per_digit each → 5000 total samples
mnist_digits: null              # Digits to include, e.g., [1, 2]. null = all digits (0-9)
samples_per_digit: 500          # Samples per digit

# === FashionMNIST Data Filtering Configuration ===
# Used when id_dataset="FashionMNIST" for ID, or for OOD when ID is MNIST
# Labels: 0=T-shirt, 1=Trouser, 2=Pullover, 3=Dress, 4=Coat,
#         5=Sandal, 6=Shirt, 7=Sneaker, 8=Bag, 9=Ankle boot
# null = all 10 classes, with fashion_samples_per_class each → 5000 total samples
fashion_mnist_classes: null     # Classes to include, e.g., [1, 2]. null = all classes
fashion_samples_per_class: 500  # Samples per class

# === OOD Detection Configuration ===
id_dataset: "FashionMNIST"      # In-distribution dataset: "MNIST" or "FashionMNIST"
ood_samples: 1000               # Number of OOD samples for evaluation
ood_score_types:                # Score types to compute for OOD detection
  - nlpd
  - rmse
  - variance
# Note: OOD score computation uses model's internal sampling
