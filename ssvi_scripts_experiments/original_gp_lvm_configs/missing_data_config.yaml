# GP-LVM Configuration with Missing Data Reconstruction
# This configuration enables missing data reconstruction capabilities for original GP-LVM

# === Basic Model Configuration ===
latent_dim: 4                    # Latent space dimensionality (smaller for GP-LVM)
n_inducing_points: 8             # Number of inducing points
pca_init: true                   # Initialize latent variables with PCA
P: 4                             # Number of structured samples

# === Training Configuration ===
training_iterations: 200         # Number of training iterations  
learning_rate: 0.01              # Learning rate for GP-LVM parameters

# === Missing Data Configuration ===
enable_missing_data: true        # Enable missing data reconstruction
missing_data_ratio: 0.3          # Fraction of dimensions to mask (30%)
reconstruction_samples: 50       # Number of samples for reconstruction

# === GP Hyperparameters ===
init_lengthscales: 2.0  # Initial lengthscales value (default matches GPyTorch RBFKernel)
init_output_noise_scale: 2.0  # Initial output noise scale (default matches GPyTorch GaussianLikelihood)
trainable_V: true                # Learn inducing point locations

# === Evaluation Configuration ===
enable_metrics: true             # Compute evaluation metrics
metrics_frequency: 100           # Compute metrics every N iterations
test_size: 0.1                   # Fraction for test set
test_optimization_steps: 50      # Steps for test latent variable optimization

# === Visualization Configuration ===
save_training_plots: true        # Save training plots
plot_save_frequency: 100         # Save plots every N iterations
plot_training: true              # Plot training curves
plot_latent_space: true          # Plot latent space visualization
plot_hyperparams: true           # Plot hyperparameter evolution

# === Logging Configuration ===
log_frequency: 50                # Log every N iterations
enable_gradient_logging: true    # Log gradient information
gradient_log_frequency: 50       # Log gradients every N iterations
save_results: true               # Save results to disk
results_dir: "oil_flow_results/original_gplvm_results"  # Fixed: relative to current working directory
