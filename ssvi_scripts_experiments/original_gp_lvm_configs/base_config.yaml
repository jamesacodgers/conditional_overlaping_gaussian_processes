# Base Original GP-LVM Configuration for Oil Flow
# Configured to match the original oil_flow_GPLVM.py script parameters

# Device Configuration
device: "auto"  # "auto", "cuda", "cpu", or specific device like "cuda:0"

# Data Configuration
data_url: "http://staffwww.dcs.shef.ac.uk/people/N.Lawrence/resources/3PhData.tar.gz"
latent_dim: 6  # A = 6 from original script

# Model Architecture (Structured GP-LVM only)
n_inducing_points: 12  # M = 12 from original script

# Training Configuration
training_iterations: 1000  # Same as original
learning_rate: 0.01  # 1e-2 from original

# GP Hyperparameters
sigma2: 1.0
beta: null  # Lengthscales (null = auto initialization)
sigma2_s: null  # Signal variances (null = auto)
P: 8  # Number of samples for structured GP-LVM (same as original)
trainable_V: true

# Visualization
plot_training: true
plot_latent_space: true
plot_hyperparams: true

# Progress Reporting
log_frequency: 100  # Log every N iterations

# Advanced Logging
enable_gradient_logging: false
gradient_log_frequency: 50  # Log gradients every N iterations
save_results: true  # Save results to folder
results_dir: "ssvi_scripts_experiments/oil_flow_results/original_gplvm_results"

# Metrics Configuration (re-enabled with adapter for tensor compatibility)
enable_metrics: true
metrics_frequency: 100  # Compute metrics every N iterations
test_size: 0.2  # Fraction of data for testing
split_random_seed: 42  # Seed for train/test split

# Visualization Configuration
save_training_plots: true
plot_save_frequency: 100  # Save plots every N iterations
