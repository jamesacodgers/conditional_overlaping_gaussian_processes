# Fast configuration for Original GP LVM testing
device: "auto"
dataset: "oilflow"
test_size: 100
random_seed: 42

# Model configuration
latent_dim: 12
n_inducing: 15
pca_init: false

# Models to run
models: ["gauss", "nn_gauss"]

# Training configuration
training_steps:
  gauss: 200
  nn_gauss: 200
batch_size: 50
learning_rate: 0.002

# Model-specific configuration
nn_layers: [10, 5]

# Results configuration
save_results: true
results_dir: "oil_flow_results/original_gplvm_results"
experiment_name: "fast"

# Visualization configuration
save_plots: true
plot_colors: ["r", "b", "g"]

# Testing configuration
enable_testing: true
test_iterations: 200
