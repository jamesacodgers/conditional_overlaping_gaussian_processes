# Base configuration for Original GP LVM matching paper settings
device: "auto"
dataset: "oilflow"
test_size: 50
random_seed: 7

# Model configuration
latent_dim: 12
n_inducing: 25
pca_init: false

# Models to run
models: ["gauss", "nn_gauss"]

# Training configuration
training_steps:
  gauss: 60000
  nn_gauss: 60000
batch_size: 100
learning_rate: 0.001

# Model-specific configuration
nn_layers: [10, 5]

# Results configuration
save_results: true
results_dir: "oil_flow_results/original_gplvm_results"
experiment_name: "base"

# Visualization configuration
save_plots: true
plot_colors: ["r", "b", "g"]

# Testing configuration
enable_testing: true
test_iterations: 5000
