# Base configuration for SSVI LVMOGP Toy Data Demonstration
# These values are from the working SSVI_LVMOGP_demonstration.ipynb

# === Device Configuration ===
device: "auto"  # "auto", "cuda", "cpu", or specific device like "cuda:0"

# === Data Generation Configuration ===
random_seed: 1
surface_type: "linear_relation"
n_new_points: 30
n_new_funs: 10
n_observed_funs: 2
domain: [0, 2]
noise: 0.05
n_grid_points: 100
observed_dims: 1
latent_dims: 2
latent_dims_lvmogp: 2
max_points: 60
lengthscales_x: [0.3, 0.3]
lengthscales_h: [0.4, 0.4]  # Will be extended to match latent_dims if needed
same_points: false

# === Model Architecture ===
n_inducing_points: 32
encoder_hidden_dims: [128, 64]
H_var_init: 0.1  # Initial variance for H (not too small for SSVI)
lik_variance_scale: 0.01  # Multiplier for data variance to set likelihood noise

# === Training Configuration ===
training_iterations: 40000
batch_size: 256  # Will be capped at data size

# === Learning Rates ===
local_lr: 0.0001  # Encoder parameters (1e-4)
global_lr: 0.001  # GP hyperparameters (1e-4)

# === GP Hyperparameters ===
init_lengthscales: 1.0  # Initial lengthscales value
init_signal_variance: 1.0  # Initial signal variance
P: 32  # Number of samples for SSVI
trainable_V: true

# === Progress Reporting ===
log_frequency: 500  # Log every N iterations
checkpoint_frequency: 2500  # Save checkpoint plots every N iterations
loss_save_frequency: 5  # Save loss every N iterations

# === Results Configuration ===
save_results: true
results_dir: "lvmogp_ruby/lvmogp_results/toy_data_results"
experiment_name: "toy_data_lvmogp_ssvi"

# === Visualization Configuration ===
plot_training: true
plot_predictions: true
plot_latent_space: true
save_final_plots: true

# === Missing Data Configuration ===
enable_missing_data: false

